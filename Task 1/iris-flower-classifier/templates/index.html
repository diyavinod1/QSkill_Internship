<!DOCTYPE html>
<html>

<head>
    <title>Iris Flower Classifier</title>

    <link rel="stylesheet"
          href="{{ url_for('static',
          filename='style.css') }}">
</head>

<body>

<div class="container">

    <div class="card">

        <h1>
            Iris Flower Classification
        </h1>

        <input type="number"
        step="0.1"
        id="sl"
        placeholder="Sepal Length">

        <input type="number"
        step="0.1"
        id="sw"
        placeholder="Sepal Width">

        <input type="number"
        step="0.1"
        id="pl"
        placeholder="Petal Length">

        <input type="number"
        step="0.1"
        id="pw"
        placeholder="Petal Width">

        <button onclick="predict()">
            Predict Species
        </button>

        <div id="result"></div>

    </div>

</div>

<script src="{{ url_for('static',
filename='script.js') }}"></script>

</body>
</html>
